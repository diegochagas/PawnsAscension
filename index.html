<noscript><div style="max-width:640px;margin:2rem auto;padding:0 16px;color:#fff;font-family:sans-serif"><h1>Pawn's Ascension</h1><p>A chess-themed action game from the Eternal Boards universe. Play as a white or black pawn across six stages of the Chess Kingdom, unlock promotions at chapel altars and defeat each boss. Also includes an 8-wave Survive mode. This game needs JavaScript.</p></div></noscript>
    <div id="wrapper">
      <canvas id="gameCanvas"></canvas>
      <div id="controller">
        <div id="dpad">
          <div class="dpad-row top-row">
            <button class="ctrl-btn dpad-btn" id="btn-up">▲</button>
          </div>
          <div class="dpad-row mid-row">
            <button class="ctrl-btn dpad-btn" id="btn-left">◄</button>
            <div class="dpad-mid"></div>
            <button class="ctrl-btn dpad-btn" id="btn-right">►</button>
          </div>
          <div class="dpad-row bot-row">
            <button class="ctrl-btn dpad-btn" id="btn-down">▼</button>
          </div>
        </div>

        <div id="center-btns">
          <button class="ctrl-btn sys-btn" id="btn-pause">II</button>
        </div>

        <div id="action-pad">
          <div class="act-row">
            <button
              class="ctrl-btn act-btn locked"
              id="btn-shield"
              title="Shield [E]"
            >
              🛡
            </button>
            <button
              class="ctrl-btn act-btn locked"
              id="btn-spear"
              title="Spear [Q]"
            >
              🗡
            </button>
          </div>
          <div class="act-row">
            <button
              class="ctrl-btn act-btn locked"
              id="btn-dash"
              title="Dash [Shift]"
            >
              »
            </button>
            <button class="ctrl-btn act-btn" id="btn-attack" title="Attack [Z]">
              ⚔
            </button>
          </div>
          <div class="act-row jump-row">
            <button
              class="ctrl-btn jump-btn"
              id="btn-jump"
              title="Jump [Space/↑]"
            >
              JUMP
            </button>
          </div>
        </div>
      </div>
    </div>
