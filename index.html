<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pawn's Ascension — Eternal Boards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="wrapper">
      <canvas id="game" aria-label="Pawn's Ascension"></canvas>
      <button id="lang" type="button" aria-label="Language">PT</button>
      <p id="hint"></p>
      <div id="touch" aria-hidden="true">
        <div class="pad">
          <button data-action="up">▲</button>
          <button data-action="left">◀</button>
          <button data-action="right">▶</button>
          <button data-action="down">▼</button>
        </div>
        <div class="mid">
          <button data-action="prevForm">◁</button>
          <button data-action="pause">II</button>
          <button data-action="nextForm">▷</button>
        </div>
        <div class="acts">
          <button data-action="sub">Q</button>
          <button data-action="power">C</button>
          <button data-action="attack">Z</button>
          <button data-action="jump">X</button>
        </div>
      </div>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
